<p>{{ count() }} Count tache</p>

<ul>
  @for (task of tasks(); track task.id) {
    <li>
      Type Produit : {{ task.title | uppercase }}   |   Date : {{ task.dueDate | date:'dd/MM/yyyy' }}
    </li>
  } @empty {
    <p class="empty">Aucune tache pour l'instant</p>
  }
</ul>

<button (click)="ajouterTache()">Ajouter une tâche</button>
<button (click)="clear()">Vider la liste</button>
